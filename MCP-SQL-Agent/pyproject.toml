[project]
name = "mcp-text2sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Koushik Jayanthi", email = "kjayanthi@deltaTRAK.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14.1",
    "httpx>=0.28.1",
    "openai>=2.52.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
mcp-text2sql = "mcp_text2sql:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
