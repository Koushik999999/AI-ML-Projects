[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drowsiness"
version = "0.1.0"
description = "Driver drowsiness detection: MobileNetV2 transfer learning, face cropping and TensorFlow Lite export"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Koushik Jayanthi" }]
dependencies = [
    "tensorflow==2.16.2",
    "keras==3.3.3",
    "opencv-python==4.10.0.84",
    "dlib-bin==20.0.1",
    "numpy==1.26.4",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
drowsiness = "drowsiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
